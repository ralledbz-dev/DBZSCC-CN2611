[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbzscc-2611"
version = "0.1.0"
description = "Local-first desktop engineering workspace"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "pydantic>=2,<3", "tomli>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
workflows = ["langchain-core==0.3.63", "langsmith==0.2.11"]

[project.scripts]
dbzscc-2611 = "dbzscc.app.main:main"

[tool.dbzscc.devserver]
kind = "pyside6-module"
module = "dbzscc"

[tool.dbzscc.execution]
pytest_paths = ["tests"]
ruff_paths = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
